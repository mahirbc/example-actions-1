name: CI

on:
  push:
    branches:
      - crawler
      - har-file
      - swagger
      - brokencrystals
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * THU"

jobs:
  start_and_wait_scan:
    runs-on: ubuntu-latest
    name: A job to run a Bright scan
    steps:
      - uses: actions/checkout@v2
      - run: |
          sudo apt update
          sudo apt install -y libssl-dev libnode-dev
          sudo curl -L "https://github.com/docker/compose/releases/download/1.26.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          sudo apt-get install -y nodejs npm
          sudo npm install -g @brightsec/cli
      - name: Save environment variables
        run: |
          printf "NEXPLOIT_TOKEN=${{ secrets.NEXPLOIT_TOKEN }}\nREPEATER=${{ secrets.REPEATER }}\n" > .env
          cat .env
      - name: Docker-Compose
        run: |
          sudo docker-compose --env-file=.env up -d
          sudo docker-compose config
      - run: sleep 30s
      - run: sudo docker-compose logs
      - name: Get bright-cli Node and npm versions
        run: |
          bright-cli --version
          node -v  
          npm -v
      - name: Start Bright Scan 🏁
        id: start
        run: |
          SCAN_ID=$(bright-cli scan:run \
            --name "BrokenCrystals from GHA Mahir" \
            --crawler "https://brokencrystals.com" \                                           \
            --token ${{ secrets.NEXPLOIT_TOKEN }} --log-level verbose 2>&1)
          echo "SCAN_ID=$SCAN_ID" >> $GITHUB_ENV
      - name: Get the output scan url 🔗
        run: |
          printf "Scan was started with ID https://nexploit.app/scans/$SCAN_ID"
      - name: Wait for issues ⏳
        run: |
          bright-cli scan:polling               \
            --interval 30s                        \
            --timeout 10m                         \
            --token ${{ secrets.NEXPLOIT_TOKEN }} \
            --breakpoint high_issue $SCAN_ID
      - name: Stop Scan 🛑
        continue-on-error: true
        if: ${{ always() }}
        run: bright-cli scan:stop --token ${{ secrets.NEXPLOIT_TOKEN }} $SCAN_ID
